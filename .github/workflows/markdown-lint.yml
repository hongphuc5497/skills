name: Lint Markdown

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".markdownlint.json"
  pull_request:
    branches: [main]
    paths:
      - "**.md"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
          fix: false
