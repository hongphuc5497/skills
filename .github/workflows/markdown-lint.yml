name: Lint Markdown

on:
  push:
    branches: [main]
    paths:
      - '**.md'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'
          config: |
            {
              "default": true,
              "line-length": false,
              "no-inline-html": { "allowed_elements": ["img", "br", "p", "a", "details", "summary", "b", "pre", "code"] },
              "no-duplicate-heading": false,
              "no-bare-urls": false,
              "first-line-heading": false,
              "single-trailing-newline": true
            }
          fix: false
