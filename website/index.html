<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills Catalog — hongphuc5497</title>
  <meta name="description" content="Curated AI agent skills for Hermes, Claude Code, Codex, Cursor, Windsurf, Copilot">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      color: #e2e8f0;
      min-height: 100vh;
      line-height: 1.6;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* Header */
    .header { text-align: center; margin-bottom: 3rem; }
    .header h1 { font-size: 2rem; font-weight: 700; color: #f8fafc; margin-bottom: 0.5rem; }
    .header .subtitle { color: #94a3b8; font-size: 0.9rem; }
    .header .badges { margin-top: 0.75rem; display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    .badge {
      background: rgba(34, 211, 238, 0.1);
      color: #22d3ee;
      border: 1px solid rgba(34, 211, 238, 0.25);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.7rem;
    }

    /* Search */
    .search-bar {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: sticky; top: 1rem; z-index: 10;
      backdrop-filter: blur(10px);
    }
    .search-bar input {
      flex: 1;
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }
    .search-bar input::placeholder { color: #475569; }
    .search-icon { color: #64748b; font-size: 1.1rem; }
    .tag-filter {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .tag {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.7rem;
      transition: all 0.15s;
      user-select: none;
    }
    .tag:hover { border-color: #22d3ee; color: #e2e8f0; }
    .tag.active { background: rgba(34, 211, 238, 0.15); border-color: #22d3ee; color: #22d3ee; }

    /* Skill Cards */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .skill-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 1.25rem;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .skill-card:hover { border-color: #334155; background: rgba(15, 23, 42, 0.9); }
    .skill-card .name {
      font-size: 1rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .skill-card .name .icon { color: #22d3ee; font-size: 0.85rem; }
    .skill-card .desc {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 0.75rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .skill-card .meta {
      display: flex;
      gap: 0.75rem;
      font-size: 0.7rem;
      color: #64748b;
    }
    .skill-card .meta span { display: flex; align-items: center; gap: 0.25rem; }
    .skill-card .category-badge {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: rgba(34, 211, 238, 0.1);
      color: #22d3ee;
      font-size: 0.65rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      border: 1px solid rgba(34, 211, 238, 0.2);
    }
    .skill-card.tailored { border-left: 2px solid #a78bfa; }
    .skill-card.tailored .category-badge {
      background: rgba(167, 139, 250, 0.1);
      border-color: rgba(167, 139, 250, 0.2);
      color: #a78bfa;
    }

    /* Detail Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      z-index: 100;
      backdrop-filter: blur(4px);
      padding: 2rem;
      overflow-y: auto;
    }
    .modal-overlay.active { display: flex; align-items: flex-start; justify-content: center; }
    .modal {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      max-width: 750px;
      width: 100%;
      padding: 2rem;
      margin: 2rem 0;
    }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; }
    .modal-header h2 { font-size: 1.3rem; color: #f8fafc; }
    .modal-close {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid #334155;
      color: #94a3b8;
      width: 32px; height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .modal-close:hover { background: #1e293b; color: #f8fafc; }
    .modal-meta {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.75rem;
      color: #64748b;
      flex-wrap: wrap;
    }
    .modal-content {
      background: rgba(2, 6, 23, 0.5);
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 1.25rem;
      font-size: 0.8rem;
      line-height: 1.7;
      color: #cbd5e1;
      white-space: pre-wrap;
      max-height: 50vh;
      overflow-y: auto;
    }
    .modal-content code {
      background: rgba(34, 211, 238, 0.1);
      color: #22d3ee;
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    .modal-content pre {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      margin: 0.5rem 0;
      font-size: 0.75rem;
    }
    .modal-install {
      margin-top: 1rem;
      background: rgba(34, 211, 238, 0.05);
      border: 1px solid rgba(34, 211, 238, 0.15);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      color: #22d3ee;
    }
    .modal-install code { background: rgba(34, 211, 238, 0.2); }

    /* Zero results */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #475569;
      font-size: 0.85rem;
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid #1e293b;
      color: #475569;
      font-size: 0.75rem;
    }
    .footer a { color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🧠 Skills Catalog</h1>
      <p class="subtitle">Curated agent skills for AI coding tools — Hermes, Claude Code, Codex, &amp; more</p>
      <div class="badges" id="stats"></div>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search skills by name, description, or tag..." autocomplete="off">
    </div>

    <!-- Tag Filter -->
    <div class="tag-filter" id="tagFilter"></div>

    <!-- Skills Grid -->
    <div class="skills-grid" id="skillsGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none">No skills match your search. Try different keywords!</div>

    <!-- Footer -->
    <p class="footer">
      github.com/<a href="https://github.com/hongphuc5497/skills">hongphuc5497/skills</a> · MIT · <span id="versionLabel"></span>
    </p>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-content" id="modalContent"></div>
      <div class="modal-install" id="modalInstall"></div>
    </div>
  </div>

  <script src="skills_data.js"></script>
  <script>
    // ── State ──────────────────────────────────────────────────
    let activeTag = null;

    // ── Init ───────────────────────────────────────────────────
    function init() {
      document.getElementById('stats').innerHTML =
        `<span class="badge">${SKILLS_DATA.length} skills</span>` +
        `<span class="badge">AGPLv3 + MIT</span>` +
        `<span class="badge">v1.0.0</span>`;

      document.getElementById('versionLabel').textContent =
        `built ${new Date().toISOString().slice(0, 10)}`;

      buildTagFilter();
      renderGrid(SKILLS_DATA);

      document.getElementById('searchInput').addEventListener('input', filterGrid);
    }

    // ── Tags ───────────────────────────────────────────────────
    function buildTagFilter() {
      const tags = new Set();
      SKILLS_DATA.forEach(s => { const cat = s.category || 'general'; tags.add(cat); });
      const container = document.getElementById('tagFilter');
      container.innerHTML = '<span class="tag active" onclick="setTag(null, this)">All</span>';
      [...tags].sort().forEach(t => {
        const el = document.createElement('span');
        el.className = 'tag';
        el.textContent = t;
        el.onclick = () => setTag(t, el);
        container.appendChild(el);
      });
    }

    function setTag(tag, el) {
      activeTag = tag;
      document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      filterGrid();
    }

    // ── Filter ─────────────────────────────────────────────────
    function filterGrid() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      let filtered = SKILLS_DATA;
      if (activeTag) filtered = filtered.filter(s => (s.category || 'general') === activeTag);
      if (q) {
        filtered = filtered.filter(s =>
          s.name.toLowerCase().includes(q) ||
          s.description.toLowerCase().includes(q) ||
          (s.category || '').toLowerCase().includes(q)
        );
      }
      renderGrid(filtered);
    }

    // ── Render ─────────────────────────────────────────────────
    function renderGrid(skills) {
      const grid = document.getElementById('skillsGrid');
      const empty = document.getElementById('emptyState');
      if (skills.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      grid.innerHTML = skills.map((s, i) => {
        const icon = s.category === 'tailored' ? '⚡' : '📦';
        const borderClass = s.category === 'tailored' ? ' tailored' : '';
        const catLabel = s.category || 'general';
        return `
          <div class="skill-card${borderClass}" onclick="openSkill(${i})">
            <span class="category-badge">${catLabel}</span>
            <div class="name"><span class="icon">${icon}</span>${s.name}</div>
            <div class="desc">${escapeHtml(s.description)}</div>
            <div class="meta">
              <span>v${s.version || '1.0.0'}</span>
            </div>
          </div>`;
      }).join('');

      // Save the original index for modal lookup
      document.querySelectorAll('.skill-card').forEach((card, idx) => {
        card.dataset.skillIdx = idx;
      });
    }

    // ── Modal ──────────────────────────────────────────────────
    function openSkill(gridIdx) {
      // Re-filter to find actual skill data index
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      let filtered = SKILLS_DATA;
      if (activeTag) filtered = filtered.filter(s => (s.category || 'general') === activeTag);
      if (q) {
        filtered = filtered.filter(s =>
          s.name.toLowerCase().includes(q) ||
          s.description.toLowerCase().includes(q) ||
          (s.category || '').toLowerCase().includes(q)
        );
      }
      const skill = filtered[gridIdx];
      if (!skill) return;

      document.getElementById('modalTitle').textContent = skill.name;
      document.getElementById('modalMeta').innerHTML =
        `<span>📦 ${skill.category || 'general'}</span>` +
        `<span>🔖 v${skill.version || '1.0.0'}</span>` +
        (skill.author && skill.author !== 'unknown'
          ? `<span>👤 ${escapeHtml(skill.author)}</span>` : '');
      document.getElementById('modalContent').innerHTML = renderMarkdown(skill.content || '');
      document.getElementById('modalInstall').innerHTML =
        `<code>npx skills add https://github.com/hongphuc5497/skills --skill ${skill.name}</code>`;
      document.getElementById('modalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // ── Simple Markdown → HTML ─────────────────────────────────
    function renderMarkdown(md) {
      if (!md) return '<em>No content</em>';
      let html = escapeHtml(md);

      // Code blocks (fenced)
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g,
        '<pre><code>$2</code></pre>');

      // Inline code
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Bold
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

      // Headers
      html = html.replace(/^### (.+)$/gm, '<h3 style="color:#22d3ee;font-size:0.85rem;margin:0.75rem 0 0.25rem">$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h3 style="color:#f8fafc;font-size:0.9rem;margin:1rem 0 0.25rem">$1</h3>');
      html = html.replace(/^# (.+)$/gm, '<h2 style="color:#f8fafc;font-size:1rem;margin:1rem 0 0.5rem">$1</h2>');

      // Tables → simple layout
      html = html.replace(/\|(.+)\|/g, (match) => {
        const cells = match.split('|').filter(c => c.trim());
        const isSep = cells.every(c => /^[-: ]+$/.test(c.trim()));
        if (isSep) return '';
        return '<div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin:0.25rem 0">' +
          cells.map(c => `<span style="color:#94a3b8;font-size:0.75rem">${c.trim()}</span>`).join('') +
          '</div>';
      });

      // Lists
      html = html.replace(/^- (.+)$/gm, '<li style="margin-left:1rem;color:#94a3b8;font-size:0.78rem">$1</li>');
      html = html.replace(/^(\d+)\. (.+)$/gm, '<li style="margin-left:1rem;color:#94a3b8;font-size:0.78rem">$1. $2</li>');

      // Links
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:#22d3ee">$1</a>');

      // Paragraph breaks
      html = html.replace(/\n\n+/g, '<br><br>');

      return html;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Go ─────────────────────────────────────────────────────
    init();
  </script>
</body>
</html>
